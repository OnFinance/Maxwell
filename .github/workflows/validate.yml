name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate workspace
        env:
          SOPS_AGE_KEY: ${{ secrets.MAXWELL_DEMO_AGE_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${SOPS_AGE_KEY}" ]]; then
            SOPS_VER=$(curl -fsSL https://api.github.com/repos/getsops/sops/releases/latest | jq -r .tag_name | sed 's/^v//')
            sudo curl -fsSL -o /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VER}/sops-v${SOPS_VER}.linux.amd64"
            sudo chmod +x /usr/local/bin/sops
            KEY_FILE="${RUNNER_TEMP}/maxwell-demo.age-key.txt"
            printf '%s\n' "${SOPS_AGE_KEY}" > "${KEY_FILE}"
            chmod 600 "${KEY_FILE}"
            export SOPS_AGE_KEY_FILE="${KEY_FILE}"
            export MAXWELL_REQUIRE_DECRYPT=1
          fi
          npm run validate
      - name: Tests
        run: npm test
